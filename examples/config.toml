# Example configuration for nym PII anonymization CLI
# Copy this file to $XDG_CONFIG_HOME/nym/config.toml and adjust as needed.
#:schema https://raw.githubusercontent.com/byteowlz/schemas/refs/heads/main/nym/nym.config.schema.json

[detection]
# Built-in patterns to enable (default: all high-confidence patterns)
# enabled_patterns = ["email", "phone_us", "ssn", "credit_card", "ipv4", "uuid"]

# Patterns to disable
# disabled_patterns = ["passport_us"]

# Minimum confidence level: "high", "medium", "low"
min_confidence = "high"

[trace_policy]
# Disabled by default. CLI: --profile agent-trace / --profile default.
# profile = "agent_trace"
# Trust only explicitly named public-reference hosts, never suffixes/wildcards.
public_hosts = []
# UTF-8 files: one literal per nonblank line; keep private lists outside git.
# Paths expand ~ and environment variables. CLI lists replace configured lists.
sensitive_terms_files = []
benign_terms_files = []
# Unicode word boundaries or "substring" for paths/identifiers; no normalization.
term_boundary = "word"
case_sensitive = true
# Sensitive matches work without the profile and win over benign lists.
# Benign lists require the profile and never suppress regex/private-cue matches.

[replacement]
# Strategy: "placeholder", "mask", "hash", "random", "consistent"
# - placeholder: Use fixed placeholders like <EMAIL>, <PHONE>
# - mask: Preserve length with X characters (user@example.com -> XXXX@XXXXXXX.XXX)
# - hash: Deterministic hash-based replacement
# - random: Random but realistic-looking replacements
# - consistent: Same input always gets same replacement (within session)
strategy = "placeholder"

# Seed for deterministic replacements (optional)
# seed = 42

# Domain for email replacements
email_domain = "example.com"

[keys]
# Default key file location (supports ~ and $ENV_VARS)
# default_key_file = "$XDG_STATE_HOME/nym/keys.jsonl"

# Auto-generate key file if not specified
auto_generate = false

# Key file retention in days (0 = forever)
retention_days = 30

[logging]
# Valid levels: error, warn, info, debug, trace
level = "warn"

[runtime]
# Parallel processing threads (0 = auto-detect based on CPU count)
parallelism = 0

# Buffer size for file reading in bytes
buffer_size = 65536

[paths]
# Uncomment to move persistent data/state to custom directories.
# data_dir = "$XDG_DATA_HOME/nym"
# state_dir = "$XDG_STATE_HOME/nym"

[ner]
# Enable the selected NER backend(s) alongside regex detection.
# `--ner` enables these engines; it does not select a backend or model.
# NER ships in the default build; `nym models use <model>` sets this to true.
enabled = false

# Which backend(s) to run: "tokens" (default), "gliner", or "both".
#   tokens = token-classification PII model (the nym models below, OpenMed, Rampart)
#   gliner = zero-shot GLiNER span model (uses `model` + `labels`)
#   both   = run both and merge (best recall, but also loads the ~1.1 GB GLiNER model)
backend = "tokens"
# --ner-model overrides token_model for tokens, model for gliner.
# With both, --ner-model is ambiguous and rejected; configure both fields here.

# Token backend only (including the token portion of "both"); GLiNER is unaffected.
# "auto" uses compiled accelerators with CPU fallback; "cpu" bypasses accelerators.
provider = "auto"

# Token-classification model for the "tokens"/"both" backends. A HuggingFace repo
# id (auto-downloaded + cached with a progress bar) or a local dir with
# model.onnx/tokenizer.json/config.json.
# Default when unset: Wismut/nym-pii-multilingual-small/int8 (144 MB, fast + small).
# token_model = "Wismut/nym-pii-multilingual"
# token_model = "Wismut/nym-pii-multilingual-small"        # 421 MB, beats teacher on real text
# token_model = "Wismut/nym-pii-multilingual-small/int8"   # 144 MB, small accuracy cost
# token_model = "nationaldesignstudio/rampart"             # 14 MB (English-centric)

# GLiNER model for the "gliner"/"both" backends (Apache-2.0, multilingual)
model = "onnx-community/gliner_multi-v2.1"

# Custom cache directory for model files
# If not set, uses HF_HOME env var or ~/.cache/huggingface/
# cache_dir = "$XDG_CACHE_HOME/huggingface"

# Confidence threshold for NER detections (0.0-1.0)
threshold = 0.5

# Token-only decoding: false = argmax, true = threshold on total entity mass.
recall_first = false

# GLiNER-only label restrictions: set backend = "gliner" before uncommenting.
# Explicit labels (even defaults) are rejected for "tokens" and "both" because
# they do not filter token classes. Omit to use these GLiNER defaults; [] is invalid.
# Regex findings are independent. Unknown labels are rejected (see config schema).
# Names: given_name aliases first_name; surname aliases last_name.
# labels = ["person", "organization", "street_address", "city", "country"]

# =============================================================================
# Rulesets
# =============================================================================
# Rulesets are named presets for common use cases. Use with: nym anon -r <name>
# Built-in rulesets: programming, identity, contact, financial, gdpr, hipaa, all, minimal
#
# You can define custom rulesets here that override or extend the built-ins:

# [rulesets.my-custom]
# description = "My custom ruleset"
# enabled_patterns = ["email", "phone_us", "person"]
# disabled_patterns = []
# min_confidence = "medium"  # "high", "medium", "low"
# ner = "auto"  # "auto", "on", "off" - auto uses NER only when needed
# strategy = "consistent"  # Override replacement strategy

# Example: Stricter programming ruleset with only API keys
# [rulesets.strict-keys]
# description = "Only high-confidence API keys and tokens"
# enabled_patterns = ["aws_key", "jwt"]
# min_confidence = "high"
# ner = "off"
# strategy = "placeholder"

# =============================================================================
# Per-pattern configuration
# =============================================================================
# Override settings for specific patterns:

# [patterns.email]
# enabled = true
# strategy = "consistent"  # Override replacement strategy for emails
# template = "<REDACTED_EMAIL>"  # Custom placeholder template

# [patterns.credit_card]
# strategy = "mask"  # Always mask credit cards regardless of global strategy

# [patterns.ssn]
# min_confidence = "high"  # Only detect high-confidence SSNs
